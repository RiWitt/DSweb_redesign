server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The Astro build uses format: 'preserve', so pages are real files
  # (/o-nas.html, /en/index.html). Serve them for extensionless URLs too.
  location / {
    try_files $uri $uri.html $uri/index.html $uri/ =404;
  }

  # Hashed assets are immutable.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
  gzip_min_length 1024;
}
